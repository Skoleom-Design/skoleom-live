services:
  postgres:
    image: postgres:16
    container_name: skoleom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: skoleom_dev_pw
      POSTGRES_DB: skoleom_live
    ports:
      # Port hote 5488 (pas 5432/5482, deja pris par d'autres instances Postgres sur cette
      # machine) pour eviter tout conflit.
      - '5488:5432'
    volumes:
      - skoleom_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skoleom_postgres_data:
